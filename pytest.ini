[pytest]
asyncio_mode = auto
# NOTE: a single session-scoped event_loop fixture (conftest.py) keeps all
# async fixtures/tests on one loop so asyncpg connections — which are
# event-loop-bound — stay valid. Do NOT set asyncio_default_fixture_loop_scope
# here: forcing fixtures onto the session loop while tests run on function
# loops re-introduces cross-loop "Future attached to a different loop" errors.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
